name: Submit a channel for Discover
description: Propose a finished DIYFM channel package for the curated catalog. / 精选频道投稿 / おすすめチャンネルへの投稿
title: "[Channel] "
labels: ["channel-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing. Nothing appears in **Discover** until a maintainer with write access adds the `channel-approved` label after listening. That label runs an Action that validates the ZIP and publishes the catalog.

        1. In DIYFM, open your channel → **Channel options → Share channel** → save the **channel package** ZIP (not a whole-library backup). Include every finished episode you want listed (a later re-share can add new ones).
        2. Attach that ZIP below (or paste an HTTPS download link if it is larger than 25 MB).
        3. Credits and usage terms are already inside the ZIP from the share step — you do **not** need to type them again here.

        **Updates:** Re-exporting the **same channel** (same DIYFM channel id) with more episodes and submitting again replaces that channel’s Discover listing after approval. It still looks like one public channel. Copies listeners already saved locally are **not** overwritten.

        **This issue and attachments are public.** Share only content you may distribute.

        中文：在 DIYFM 里用「频道管理 → 分享频道」保存分享包（不要用整库备份），勾选想上架的成片后把 ZIP 贴到下面。署名和使用条款已在分享包里，这里不用再填。本页和附件公开可见。维护者试听后打上 `channel-approved` 才会校验并上架。**同一栏目再次分享并投稿**（频道 id 相同、内容更新），审核通过后会**替换精选里的旧快照**，听众仍看到一个公共频道；已下载到本机的旧包不会自动改写。

        日本語：DIYFMで「チャンネル管理 → チャンネルを共有」から共有パッケージ（ライブラリ全体のバックアップではない）を保存し、掲載したい完成話を選んでZIPを添付してください。署名と利用条件はパッケージ内にあるため再入力不要です。投稿は公開されます。メンテナーが試聴後に `channel-approved` を付けると検証のうえ掲載されます。**同じチャンネル（同一ID）を再エクスポートして再投稿**し承認されると、Discoverの旧スナップショットは**置き換え**られ、公開上は一つのチャンネルのままです。端末に保存済みのコピーは自動更新されません。
  - type: input
    id: title
    attributes:
      label: Channel title / 频道名称 / チャンネル名
      description: The name listeners will see. / 听众看到的名称。 / リスナーに見える名前。
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Listening language / 收听语言 / 聴取言語
      options:
        - English
        - Japanese / 日本語
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Channel package / 频道分享包 / 共有パッケージ
      description: Drag the ZIP here (GitHub accepts attachments up to 25 MB). Larger packages, up to the 100 MiB format limit, may use an HTTPS download link instead. / 把 ZIP 拖到这里（GitHub 附件上限 25 MB；更大可用 HTTPS 链接，格式上限 100 MiB）。 / ZIPをここにドラッグ（GitHub添付は25MBまで。それ以上はHTTPSリンク、形式上限は100MiB）。
      placeholder: diyfm-channel-….zip or https://…
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer (optional) / 给审核的备注（可选） / 審査向けメモ（任意）
      description: Anything helpful — BGM source, what is fictional, AI disclosure already in the package, etc. / 背景音乐来源、哪些是虚构、包内是否已说明 AI 合成等。 / BGMの出典、フィクションの範囲、パッケージ内のAI合成の記載など。
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting / 提交前确认 / 投稿前の確認
      options:
        - label: I may distribute everything in this package (scripts, voices, music, referenced sources). / 我有权分发包内全部内容。 / パッケージ内の全内容を配布する権利があります。
          required: true
        - label: AI-made audio and fictional stories are clearly disclosed in the channel description or credits inside the package. / 包内简介或署名已说明 AI 合成与虚构内容。 / パッケージ内の説明またはクレジットでAI合成とフィクションを明示しています。
          required: true
        - label: There is no private or personal information in the package, and I understand this submission is public. / 包内无私人信息，且我理解本投稿公开可见。 / 個人情報は含まれず、この投稿が公開されることを理解しています。
          required: true
        - label: I understand listing is at the maintainers' discretion, and already-downloaded copies cannot be recalled. / 是否上架由维护者决定；已下载的副本无法远程撤回。 / 掲載はメンテナーの判断であり、既にダウンロードされたコピーは撤回できません。
          required: true
